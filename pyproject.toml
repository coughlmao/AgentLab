[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimized-agent-team-scaling"
version = "0.1.0"
description = "A scaling lab for agent teams: strategies, budgets, sandboxed verification, and evaluation-artifact audits"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Saloni Garg" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["teamscale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
